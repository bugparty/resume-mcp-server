name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Tests never call real LLM / S3 / LaTeX services; keep keys empty.
      GOOGLE_API_KEY: ""
      DEEPSEEK_API_KEY: ""
      OPENAI_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --python 3.12

      - name: Check formatting
        run: uv run black --check src tests scripts

      - name: Run test suite
        run: ./run_tests.sh
