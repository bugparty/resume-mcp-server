[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-mcp-server"
version = "0.1.0"
description = "MCP server for managing, tailoring and rendering resume versions"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # MCP server
    "fastmcp>=3.1.0,<4",
    "starlette>=0.46.2,<1",
    "uvicorn>=0.35.0,<1",
    "pydantic>=2.11.7,<3",
    "python-dotenv>=1.1.0,<2",
    # storage (local / S3 via PyFilesystem2) and uploads
    "fs>=2.4.16,<3",
    "fs-s3fs>=1.1.1,<2",
    "boto3>=1.35.94,<2",
    "botocore>=1.35.94,<2",
    # resume parsing and rendering
    "pyyaml>=6.0.2,<7",
    "jinja2>=3.1.6,<4",
    "rapidfuzz>=3.14.1,<4",
    "requests>=2.32.3,<3",
    # semantic search
    "chromadb>=0.6.3,<0.7",
    "langchain-google-genai>=2.0.10,<3",
    "langchain-openai>=0.3.14,<0.4",
    "openrouter>=0.7.11,<0.8",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3.4,<9",
    "pytest-cov>=6.0.0,<7",
    "jsonschema>=4.23.0,<5",  # schema tests and scripts/validate_resume_yaml.py
]

[project.scripts]
resume-mcp = "resume_platform.interfaces.mcp.server:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.format]
exclude = ["*.md"]  # leave code samples in prose docs alone

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, simplify, no print in src
select = ["E", "W", "F", "I", "UP", "B", "SIM", "T20"]
ignore = ["E501"]  # long lines: the formatter wraps code; long strings are fine

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20", "W291"]  # trailing spaces in test inputs are deliberate
"scripts/**" = ["T20"]
"skills/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["resume_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:pkg_resources.*",
    "ignore::UserWarning:fs.*",
    "ignore::DeprecationWarning:fs.*",
    "ignore::DeprecationWarning:.*pkg_resources.*",
    "ignore::DeprecationWarning:google.*",
    "ignore::DeprecationWarning:.*langchain.*"
]

[tool.coverage.run]
source = ["resume_platform"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
